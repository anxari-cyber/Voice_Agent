[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceai-agent"
version = "0.1.0"
description = "Local voice-controlled software agent for Windows"
requires-python = ">=3.10,<3.13"
dependencies = [
    "faster-whisper>=1.1.0",
    "google-genai>=1.0.0",
    "httpx>=0.27.0",
    "nvidia-cublas-cu12>=12.0",
    "nvidia-cuda-runtime-cu12>=12.0",
    "nvidia-cuda-nvrtc-cu12>=12.0",
    "nvidia-cudnn-cu12>=9,<10",
    "numpy>=1.26.0",
    "pydantic-settings>=2.6.0",
    "sounddevice>=0.5.0",
    # Parakeet STT. Uses onnxruntime-directml because the CUDA build of onnxruntime
    # cannot run on RTX 50-series (Blackwell) GPUs. Only one onnxruntime package may be
    # installed: if faster-whisper pulls in plain "onnxruntime", uninstall it afterwards.
    "onnx-asr[hub]>=0.12.0",
    "onnxruntime-directml>=1.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[project.scripts]
voiceai = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*", "agent*", "config*", "metrics*", "models*", "progress*", "security*", "tools*", "voice*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
